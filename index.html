<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANIDEX — Animal Warfare Database</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Mobile Header -->
    <header class="mobile-header">
        <span class="brand-pixel">ANIDEX</span>
        <div class="mobile-actions">
            <button class="icon-btn" onclick="App.toggleFilter()" title="Filters">&#9776;</button>
        </div>
    </header>

    <!-- Sidebar / Filter Panel -->
    <aside id="sidebar">
        <div class="sidebar-inner">
            <div class="sidebar-brand">
                <span class="brand-pixel">ANIDEX</span>
                <span class="sidebar-subtitle">ANIMAL WARFARE DATABASE</span>
                <a href="animal_report.html" class="tab-btn"
                    style="margin-top:15px;text-decoration:none;display:block;text-align:center;width:100%;box-sizing:border-box;">&#127894;
                    FULL RANKINGS</a>
            </div>

            <!-- Search Bar -->
            <div class="filter-section">
                <div class="filter-label">SEARCH</div>
                <div class="search-wrap">
                    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8" />
                        <path d="m21 21-4.35-4.35" />
                    </svg>
                    <input type="text" id="q" placeholder="Search name, ability..." oninput="App.filter()">
                </div>
            </div>

            <!-- Tab Switch -->
            <div class="filter-section">
                <div class="filter-label">VIEW MODE</div>
                <div class="tab-switch">
                    <button class="tab-btn active" id="btn-animals" onclick="App.setMode('animals')">ANIMALS</button>
                    <button class="tab-btn" id="btn-items" onclick="App.setMode('items')">ITEMS</button>
                </div>
            </div>

            <!-- Animal Filters (shown only in animals mode) -->
            <div id="animal-filters">
                <div class="filter-section">
                    <div class="filter-label">BIOME</div>
                    <select id="flt-biome" onchange="App.filter()">
                        <option value="">All Biomes</option>
                    </select>
                </div>

                <div class="filter-section">
                    <div class="filter-label">CATEGORY 1</div>
                    <select id="flt-cat1" onchange="App.filter()">
                        <option value="">All Categories</option>
                    </select>
                </div>

                <div class="filter-section">
                    <div class="filter-label">CATEGORY 2</div>
                    <select id="flt-cat2" onchange="App.filter()">
                        <option value="">All Categories</option>
                    </select>
                </div>

                <div class="filter-section">
                    <div class="filter-label">RARITY</div>
                    <select id="flt-rarity" onchange="App.filter()">
                        <option value="">All Rarities</option>
                        <option value="Common">Common</option>
                        <option value="Uncommon">Uncommon</option>
                        <option value="Rare">Rare</option>
                        <option value="Epic">Epic</option>
                        <option value="Legendary">Legendary</option>
                        <option value="Mythical">Mythical</option>
                    </select>
                </div>

                <div class="filter-section">
                    <label
                        style="display: flex; align-items: center; gap: 8px; cursor: pointer; color: var(--text-dim); font-size: 11px; font-weight: 700; letter-spacing: 1px;">
                        <input type="checkbox" id="chk-exclude-mythical" onchange="App.filter()"
                            style="accent-color: var(--accent);">
                        EXCLUDE MYTHICALS
                    </label>
                </div>

                <div class="filter-section">
                    <div class="filter-label">ABILITY</div>
                    <select id="flt-ability" onchange="App.filter()">
                        <option value="">All Abilities</option>
                    </select>
                </div>

                <div class="filter-section">
                    <div class="filter-label">MOVE</div>
                    <select id="flt-move" onchange="App.filter()">
                        <option value="">All Moves</option>
                    </select>
                </div>

                <div class="filter-section">
                    <div class="filter-label">DROP</div>
                    <select id="flt-drop" onchange="App.filter()">
                        <option value="">All Drops</option>
                    </select>
                </div>

                <div class="filter-section">
                    <div class="filter-label">CLASS</div>
                    <select id="flt-class" onchange="App.filter()">
                        <option value="">All Classes</option>
                    </select>
                </div>

                <div class="filter-section">
                    <div class="filter-label">DIET</div>
                    <select id="flt-diet" onchange="App.filter()">
                        <option value="">All Diets</option>
                    </select>
                </div>

                <div class="filter-section">
                    <div class="filter-label">WEIGHT</div>
                    <select id="flt-weight" onchange="App.filter()">
                        <option value="">All Weights</option>
                        <option value="tiny">&lt; 1 kg</option>
                        <option value="small">1 - 10 kg</option>
                        <option value="medium">10 - 50 kg</option>
                        <option value="large">50 - 100 kg</option>
                        <option value="huge">&gt; 100 kg</option>
                    </select>
                </div>

                <div class="filter-section">
                    <div class="filter-label">SIZE</div>
                    <select id="flt-size" onchange="App.filter()">
                        <option value="">All Sizes</option>
                        <option value="tiny">&lt; 0.5 m</option>
                        <option value="small">0.5 - 2 m</option>
                        <option value="medium">2 - 5 m</option>
                        <option value="large">5 - 10 m</option>
                        <option value="huge">&gt; 10 m</option>
                    </select>
                </div>
                <div class="filter-section">
                    <div class="filter-label">ROBUSTNESS</div>
                    <select id="flt-robustness" onchange="App.filter()">
                        <option value="">All Robustness</option>
                        <option value="tiny">&lt; 1 λ</option>
                        <option value="small">1 - 10 λ</option>
                        <option value="medium">10 - 50 λ</option>
                        <option value="large">50 - 100 λ</option>
                        <option value="huge">&gt; 100 λ</option>
                    </select>
                </div>

                <div class="filter-section">
                    <div class="filter-label">BST</div>
                    <select id="flt-bst" onchange="App.filter()">
                        <option value="">All BST</option>
                        <option value="vlow">&lt; 300</option>
                        <option value="low">300 - 450</option>
                        <option value="med">450 - 550</option>
                        <option value="high">550 - 650</option>
                        <option value="vhigh">&gt; 650</option>
                    </select>
                </div>

                <div class="filter-section">
                    <div class="filter-label">UNITS</div>
                    <select id="flt-units" onchange="App.setUnitSystem(this.value)">
                        <option value="metric">Metric (KG/M)</option>
                        <option value="imperial">Imperial (LBS/FT)</option>
                    </select>
                </div>

                <div class="filter-section">
                    <div class="filter-label">SORT BY</div>
                    <div class="sort-chips" id="sort-chips">
                        <button class="sort-chip active" data-sort="name" onclick="App.setSort('name')">NAME</button>
                        <button class="sort-chip" data-sort="health" onclick="App.setSort('health')">HP</button>
                        <button class="sort-chip" data-sort="attack" onclick="App.setSort('attack')">ATK</button>
                        <button class="sort-chip" data-sort="defense" onclick="App.setSort('defense')">DEF</button>
                        <button class="sort-chip" data-sort="power" onclick="App.setSort('power')">PWR</button>
                        <button class="sort-chip" data-sort="resistance"
                            onclick="App.setSort('resistance')">RES</button>
                        <button class="sort-chip" data-sort="speed" onclick="App.setSort('speed')">SPD</button>
                        <button class="sort-chip" data-sort="bst" onclick="App.setSort('bst')">BST</button>
                        <button class="sort-chip" data-sort="weight" onclick="App.setSort('weight')">WEIGHT</button>
                        <button class="sort-chip" data-sort="size" onclick="App.setSort('size')">SIZE</button>
                        <button class="sort-chip" data-sort="robustness" onclick="App.setSort('robustness')">ROBUSTNESS</button>
                    </div>
                    <button class="order-btn" id="order-btn" onclick="App.toggleOrder()">
                        <span id="order-label">ASCENDING</span>
                        <span id="order-icon">↑</span>
                    </button>
                </div>
            </div>

            <!-- Items filter -->
            <div id="item-filters" style="display:none;">
                <div class="filter-section">
                    <div class="filter-label">ITEM CATEGORY</div>
                    <select id="flt-item-cat" onchange="App.filterItems()">
                        <option value="">All Categories</option>
                    </select>
                </div>
            </div>

            <button class="reset-btn" onclick="App.reset()">RESET ALL FILTERS</button>
        </div>
    </aside>

    <div id="sidebar-overlay" class="sidebar-overlay" onclick="App.toggleFilter()"></div>

    <!-- Main Content -->
    <main>
        <div class="main-header">
            <div class="result-count" id="result-count">Loading...</div>
        </div>

        <div id="grid" class="grid"></div>

        <!-- Infinite scroll sentinel -->
        <div id="sentinel" style="height:1px;"></div>
        <div id="loading-more" class="loading-more" style="display:none;">
            <div class="loading-spinner"></div>
        </div>
    </main>

    <!-- Detail Modal -->
    <div id="modal" class="modal-overlay" onclick="App.closeModal()">
        <div class="modal-box" onclick="event.stopPropagation()">
            <button class="modal-close" onclick="App.closeModal()">✕</button>
            <div id="modal-content"></div>
        </div>
    </div>

    <script>
        const App = {
            db: { orgs: [], orgs2: [], moves: {}, items: [], abilities: {} },
            filtered: [],
            displayedCount: 0,
            batchSize: 24,
            mode: 'animals',
            sortBy: 'name',
            ascending: true,
            unitSystem: 'metric',
            observer: null,

            async start() {
                try {
                    const [o1, o2, m, t, a] = await Promise.all([
                        fetch('assets/Organisms.json').then(r => r.json()).catch(() => []),
                        fetch('assets/Organisms2.json').then(r => r.json()).catch(() => []),
                        fetch('assets/moves.json').then(r => r.json()).catch(() => []),
                        fetch('assets/talismans.json').then(r => r.json()).catch(() => []),
                        fetch('assets/abilities.json').then(r => r.json()).catch(() => [])
                    ]);

                    this.db.orgs = [...(o1 || []), ...(o2 || [])];
                    this.db.items = t || [];
                    (m || []).forEach(mv => this.db.moves[mv.name.toLowerCase()] = mv);
                    (a || []).forEach(ab => this.db.abilities[ab.name.toLowerCase()] = ab);

                    this.populateFilters();
                    this.filter();
                    this.setupObserver();
                } catch (e) {
                    console.error('Failed to load data', e);
                    document.getElementById('grid').innerHTML = '<div class="empty-state"><p>⚠️ Failed to load data. Open via a local server or file server.</p></div>';
                }
            },

            populateFilters() {
                const orgs = this.db.orgs;

                // Biomes
                const biomes = [...new Set(orgs.flatMap(o => (o.habitat || '').split(',').map(s => s.trim()).filter(Boolean)))].sort();
                this._populate('flt-biome', biomes);

                // Categories (types)
                const cats = [...new Set(orgs.flatMap(o => (o.category || '').split(',').map(s => s.trim()).filter(Boolean)))].sort();
                this._populate('flt-cat1', cats);
                this._populate('flt-cat2', cats);

                // Abilities
                const abilities = [...new Set(orgs.flatMap(o => (o.abilities || '').split(',').map(s => s.trim()).filter(Boolean)))].sort();
                this._populate('flt-ability', abilities);

                // Moves
                const moves = [...new Set(orgs.flatMap(o => (o.moves || '').split(',').map(s => s.trim()).filter(Boolean)))].sort();
                this._populate('flt-move', moves);

                // Drops
                const drops = [...new Set(orgs.flatMap(o => (o.drops || '').split(',').map(s => s.trim()).filter(Boolean)))].sort();
                this._populate('flt-drop', drops);

                // Classes
                const classes = [...new Set(orgs.map(o => o.class || o.animal_class).filter(Boolean))].sort();
                this._populate('flt-class', classes);

                // Diets
                const diets = [...new Set(orgs.map(o => o.diet).filter(Boolean))].sort();
                this._populate('flt-diet', diets);

                // Item categories
                const itemCats = [...new Set(this.db.items.map(i => i.category || '').filter(Boolean))].sort();
                this._populate('flt-item-cat', itemCats);
            },

            _populate(id, values) {
                const sel = document.getElementById(id);
                if (!sel) return;
                const defaultOpt = sel.options[0].text;
                const defaultVal = sel.options[0].value;
                sel.innerHTML = `<option value="${defaultVal}">${defaultOpt}</option>`;
                values.forEach(v => {
                    const opt = document.createElement('option');
                    opt.value = v;
                    opt.textContent = v.toUpperCase();
                    sel.appendChild(opt);
                });
            },

            filter() {
                if (this.mode === 'items') { this.filterItems(); return; }
                const q = document.getElementById('q').value.toLowerCase();
                const biome = document.getElementById('flt-biome').value;
                const cat1 = document.getElementById('flt-cat1').value;
                const cat2 = document.getElementById('flt-cat2').value;
                const rarity = document.getElementById('flt-rarity').value;
                const ability = document.getElementById('flt-ability').value;
                const move = document.getElementById('flt-move').value;
                const drop = document.getElementById('flt-drop').value;
                const aClass = document.getElementById('flt-class').value;
                const aDiet = document.getElementById('flt-diet').value;
                const weight = document.getElementById('flt-weight').value;
                const sizeVal = document.getElementById('flt-size').value;
                const robustnessVal = document.getElementById('flt-robustness').value;
                const bstVal = document.getElementById('flt-bst').value;
                const excludeMythical = document.getElementById('chk-exclude-mythical').checked;

                this.filtered = this.db.orgs.filter(o => {
                    if (q && !o.name.toLowerCase().includes(q) &&
                        !(o.scientific_name || '').toLowerCase().includes(q) &&
                        !(o.abilities || '').toLowerCase().includes(q)) return false;
                    if (biome && !(o.habitat || '').includes(biome)) return false;
                    if (cat1 && !(o.category || '').toUpperCase().includes(cat1.toUpperCase())) return false;
                    if (cat2 && !(o.category || '').toUpperCase().includes(cat2.toUpperCase())) return false;
                    if (rarity && (o.rarity || '').toLowerCase() !== rarity.toLowerCase()) return false;
                    if (ability && !(o.abilities || '').includes(ability)) return false;
                    if (move && !(o.moves || '').includes(move)) return false;
                    if (drop && !(o.drops || '').includes(drop)) return false;
                    if (aClass && (o.class || o.animal_class) !== aClass) return false;
                    if (aDiet && o.diet !== aDiet) return false;
                    if (excludeMythical && (o.rarity || '').toLowerCase() === 'mythical') return false;
                    if (weight) {
                        const w = parseFloat(o.weight) || 0;
                        if (weight === 'tiny' && w >= 1) return false;
                        if (weight === 'small' && (w < 1 || w >= 10)) return false;
                        if (weight === 'medium' && (w < 10 || w >= 50)) return false;
                        if (weight === 'large' && (w < 50 || w >= 100)) return false;
                        if (weight === 'huge' && w < 100) return false;
                    }
                    if (sizeVal) {
                        const s = parseFloat(o.size) || 0;
                        if (sizeVal === 'tiny' && s >= 0.5) return false;
                        if (sizeVal === 'small' && (s < 0.5 || s >= 2)) return false;
                        if (sizeVal === 'medium' && (s < 2 || s >= 5)) return false;
                        if (sizeVal === 'large' && (s < 5 || s >= 10)) return false;
                        if (sizeVal === 'huge' && s < 10) return false;
                    }
                    if (robustnessVal) {
                        const r = (parseFloat(o.weight) || 0) / (parseFloat(o.size) || 1);
                        if (robustnessVal === 'tiny' && r >= 1) return false;
                        if (robustnessVal === 'small' && (r < 1 || r >= 10)) return false;
                        if (robustnessVal === 'medium' && (r < 10 || r >= 50)) return false;
                        if (robustnessVal === 'large' && (r < 50 || r >= 100)) return false;
                        if (robustnessVal === 'huge' && r < 100) return false;
                    }
                    if (bstVal) {
                        const bst = (o.health || 0) + (o.attack || 0) + (o.defense || 0) + (o.power || 0) + (o.resistance || 0) + (o.speed || 0);
                        if (bstVal === 'vlow' && bst >= 300) return false;
                        if (bstVal === 'low' && (bst < 300 || bst >= 450)) return false;
                        if (bstVal === 'med' && (bst < 450 || bst >= 550)) return false;
                        if (bstVal === 'high' && (bst < 550 || bst >= 650)) return false;
                        if (bstVal === 'vhigh' && bst < 650) return false;
                    }
                    return true;
                });

                // Sort
                this.filtered.sort((a, b) => {
                    if (this.sortBy === 'weight' || this.sortBy === 'size' || this.sortBy === 'bst' || this.sortBy === 'health' || this.sortBy === 'attack' || this.sortBy === 'defense' || this.sortBy === 'power' || this.sortBy === 'resistance' || this.sortBy === 'speed' || this.sortBy === 'robustness') {
                        let va, vb;
                        if (this.sortBy === 'robustness') {
                            va = (parseFloat(a.weight) || 0) / (parseFloat(a.size) || 1);
                            vb = (parseFloat(b.weight) || 0) / (parseFloat(b.size) || 1);
                        } else if (this.sortBy === 'bst') {
                            va = (a.health || 0) + (a.attack || 0) + (a.defense || 0) + (a.power || 0) + (a.resistance || 0) + (a.speed || 0);
                            vb = (b.health || 0) + (b.attack || 0) + (b.defense || 0) + (b.power || 0) + (b.resistance || 0) + (b.speed || 0);
                        } else {
                            va = parseFloat(a[this.sortBy]) || 0;
                            vb = parseFloat(b[this.sortBy]) || 0;
                        }
                        return this.ascending ? va - vb : vb - va;
                    }
                    return this.ascending ? (a.name || '').localeCompare(b.name || '') : (b.name || '').localeCompare(a.name || '');
                });

                this.displayedCount = 0;
                document.getElementById('grid').innerHTML = '';
                document.getElementById('result-count').textContent = `${this.filtered.length} ANIMALS FOUND`;
                this.renderMore();
            },

            filterItems() {
                const q = document.getElementById('q').value.toLowerCase();
                const cat = document.getElementById('flt-item-cat').value;

                const items = this.db.items.filter(i => {
                    if (q && !i.name.toLowerCase().includes(q) && !(i.category || '').toLowerCase().includes(q)) return false;
                    if (cat && (i.category || '') !== cat) return false;
                    return true;
                });

                const grid = document.getElementById('grid');
                grid.innerHTML = '';
                document.getElementById('result-count').textContent = `${items.length} ITEMS FOUND`;

                items.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'card item-card';
                    card.onclick = () => this.showItemDetail(item);
                    const imgSrc = `assets/items/${(item.name || '').toLowerCase().replace(/\s+/g, '-').replace(/[^a-z0-9-]/g, '')}.png`;
                    card.innerHTML = `
                    <div class="card-sprite-wrap item-sprite-wrap">
                        <img src="${imgSrc}" alt="${item.name}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
                        <div class="sprite-fallback" style="display:none">📦</div>
                    </div>
                    <div class="card-body">
                        <div class="card-type-row">
                            <span class="type-badge" style="background:var(--accent-dim);color:var(--accent)">${(item.category || 'item').toUpperCase()}</span>
                        </div>
                        <div class="card-name">${(item.name || '').replace(/_/g, ' ').toUpperCase()}</div>
                        <div class="card-sub">${item.price ? item.price + 'G' : ''}</div>
                    </div>`;
                    grid.appendChild(card);
                });
            },

            renderMore() {
                const slice = this.filtered.slice(this.displayedCount, this.displayedCount + this.batchSize);
                const grid = document.getElementById('grid');
                slice.forEach(org => {
                    grid.appendChild(this.buildAnimalCard(org));
                });
                this.displayedCount += slice.length;
                document.getElementById('loading-more').style.display =
                    this.displayedCount < this.filtered.length ? 'flex' : 'none';
            },

            buildAnimalCard(org) {
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => this.showDetail(org.name);

                const spriteSrc = this.getSpritePath(org);
                const rarity = (org.rarity || 'common').toLowerCase();
                const rarityColor = this.rarityColor(rarity);
                const types = (org.category || 'basic').split(',').map(s => s.trim()).filter(Boolean);
                const aClass = (org.class || org.animal_class || 'Unknown').toLowerCase().replace(/ /g, '_');
                const aDiet = (org.diet || 'Unknown').toLowerCase().replace(/ /g, '_');

                card.innerHTML = `
                <div class="card-inner">
                    <div class="card-sprite-wrap" style="background-image: url('${this.rarityBackground(rarity)}'); background-size: cover; background-position: center;">
                        <div class="card-sprite-overlay" style="background: radial-gradient(circle at center, ${rarityColor}22 0%, transparent 70%);"></div>
                        <img src="${spriteSrc}" alt="${org.name}"
                             onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
                        <div class="sprite-fallback" style="display:none">🦎</div>
                        <div class="card-type-row">
                            ${types.slice(0, 2).map(t => { const tSlug = t.toLowerCase().replace(/ /g, '_'); return `<span class="type-badge type-${tSlug}" title="${t.toUpperCase()}"><img src="assets/icon/${tSlug}.png" class="type-icon" alt="${t}" onerror="this.style.display='none'"></span>` }).join('')}
                        </div>
                        <div class="card-class-row" style="position: absolute; bottom: 10px; right: 10px; display: flex; gap: 6px; z-index: 3;">
                            <span class="type-badge" title="${(org.class || org.animal_class || 'Unknown').toUpperCase()}"><img src="assets/icon/${aClass}.png" class="type-icon" alt="${aClass}" onerror="this.src='assets/icon/unknown.png'; this.style.display='none'"></span>
                            <span class="type-badge" title="${(org.diet || 'Unknown').toUpperCase()}"><img src="assets/icon/${aDiet}.png" class="type-icon" alt="${aDiet}" onerror="this.src='assets/icon/unknown.png'; this.style.display='none'"></span>
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="card-name">${org.name.toUpperCase()}</div>
                        <div class="card-sub">${org.scientific_name || 'Unknown Species'}</div>
                    </div>
                </div>`;
                return card;
            },

            setupObserver() {
                this.observer = new IntersectionObserver(entries => {
                    if (entries[0].isIntersecting && this.mode === 'animals') {
                        this.renderMore();
                    }
                }, { rootMargin: '200px' });
                this.observer.observe(document.getElementById('sentinel'));
            },

            getSpritePath(org) {
                let clean = org.name.toLowerCase()
                    .replace(/[^a-z0-9]/g, '_')
                    .replace(/_+/g, '_')
                    .replace(/^_|_$/g, '');
                return `assets/sprites/${clean}.png`;
            },

            rarityColor(rarity) {
                const map = {
                    common: '#8b949e', uncommon: '#2ecc71', rare: '#3399ff',
                    epic: '#aa55cc', legendary: '#ff9933', mythical: '#ff55aa'
                };
                return map[rarity] || '#8b949e';
            },

            typeColor(type) {
                const map = {
                    basic: '#aaaa99', blaze: '#ff4422', aquatic: '#3399ff', grass: '#77cc55',
                    electric: '#ffcc33', cryo: '#aaddff', martial: '#cc3344', toxic: '#aa55aa',
                    earth: '#aa8855', flying: '#99ccff', mystic: '#ff66aa', arthropod: '#88aa44',
                    rock: '#bbaa66', darkness: '#5566aa', spectral: '#9966ff', metal: '#7799aa',
                    aura: '#44aaaa', sound: '#ff7733', holy: '#ffcc44', drake: '#7744aa'
                };
                return map[type.toLowerCase()] || '#888';
            },

            showDetail(name) {
                const org = this.db.orgs.find(x => x.name === name);
                if (!org) return;

                const rarity = (org.rarity || 'common').toLowerCase();
                const rarityColor = this.rarityColor(rarity);
                const types = (org.category || 'basic').split(',').map(s => s.trim()).filter(Boolean);
                const abilities = (org.abilities || '').split(',').map(s => s.trim()).filter(Boolean);
                const moves = (org.moves || '').split(',').map(s => s.trim()).filter(Boolean);
                const drops = (org.drops || '').split(',').map(s => s.trim()).filter(Boolean);
                const biomes = (org.habitat || '').split(',').map(s => s.trim()).filter(Boolean);
                const spriteSrc = this.getSpritePath(org);

                const stats = [
                    { label: 'HEALTH', key: 'health', color: '#e74c3c', icon: '❤', max: 500 },
                    { label: 'ATTACK', key: 'attack', color: '#e67e22', icon: '⚡', max: 200 },
                    { label: 'DEFENSE', key: 'defense', color: '#3498db', icon: '🛡', max: 200 },
                    { label: 'POWER', key: 'power', color: '#9b59b6', icon: '✨', max: 200 },
                    { label: 'RESISTANCE', key: 'resistance', color: '#1abc9c', icon: '🧠', max: 200 },
                    { label: 'SPEED', key: 'speed', color: '#f39c12', icon: '💨', max: 200 },
                ];

                const statsHTML = stats.map(s => {
                    const val = org[s.key] || 0;
                    const pct = Math.min(100, (val / s.max) * 100);
                    return `<div class="detail-stat-row">
                    <div class="detail-stat-meta">
                        <span class="detail-stat-label">${s.icon} ${s.label}</span>
                        <span class="detail-stat-val" style="color:${s.color}">${val}</span>
                    </div>
                    <div class="stat-track">
                        <div class="stat-bar" style="width:${pct}%;background:${s.color}"></div>
                    </div>
                </div>`;
                }).join('');

                const abilitiesHTML = abilities.map(aName => {
                    const ab = this.db.abilities[aName.toLowerCase()] || {};
                    return `<div class="detail-ability-card">
                    <div class="ability-name">⚡ ${aName.toUpperCase()}</div>
                    <div class="ability-desc">${ab.description || 'Passive trait — effects unknown.'}</div>
                </div>`;
                }).join('') || '<p class="dim">No abilities listed.</p>';

                const movesHTML = moves.length ? `
                <table class="move-table">
                    <thead>
                        <tr><th>MOVE</th><th>TYPE</th><th>PWR</th><th>ACC</th><th>PP</th></tr>
                    </thead>
                    <tbody>
                        ${moves.map(mName => {
                    const md = this.db.moves[mName.toLowerCase()] || {};
                    const tc = this.typeColor(md.type || 'basic');
                    return `<tr onclick="App.showMoveDetail('${mName.replace(/'/g, "\\'")}')">
                                <td class="move-name">${mName}</td>
                                <td><span class="type-badge type-${(md.type || 'basic').toLowerCase()}" title="${(md.type || 'basic').toUpperCase()}"><img src="assets/icon/${(md.type || 'basic').toLowerCase()}.png" class="type-icon" alt="${md.type || 'basic'}" onerror="this.style.display='none'"></span></td>
                                <td class="move-val">${md.baseDamage || '—'}</td>
                                <td class="move-val">${md.accuracy || '100'}</td>
                                <td class="move-val">${md.stamina || '—'}</td>
                            </tr>`;
                }).join('')}
                    </tbody>
                </table>` : '<p class="dim">No moves listed.</p>';

                const biomesHTML = biomes.map(b => {
                    const bname = b.toLowerCase().replace(/\s+/g, '_');
                    return `<div class="biome-chip">
                    <img src="assets/biomes/${bname}.png" alt="${b}" onerror="this.style.display='none'">
                    <span>${b.toUpperCase()}</span>
                </div>`;
                }).join('') || '<span class="dim">Unknown</span>';

                const dropsHTML = drops.length
                    ? drops.map(d => {
                        const cleanName = d.toLowerCase().replace(/\s+/g, '-').replace(/[^a-z0-9-]/g, '');
                        return `<span class="drop-tag"><img class="drop-icon" src="assets/items/${cleanName}.png" onerror="this.style.display='none'" alt="">${d}</span>`;
                    }).join('')
                    : '<span class="dim">No drops</span>';

                const aClass = org.class || org.animal_class || 'Unknown';
                const aDiet = org.diet || 'Unknown';
                const aActivity = org.active_time || org.activity || 'Unknown';

                let weightLabel = 'Unknown';
                if (org.weight) {
                    const w = org.weight;
                    if (this.unitSystem === 'imperial') {
                        const lbs = (w * 2.20462).toFixed(1).replace(/\.0$/, '');
                        weightLabel = `${lbs} LBS`;
                    } else {
                        if (w >= 1000) weightLabel = `${(w / 1000).toFixed(1).replace(/\.0$/, '')} TONS`;
                        else if (w >= 1) weightLabel = `${w} KG`;
                        else if (w >= 0.001) weightLabel = `${(w * 1000).toFixed(1).replace(/\.0$/, '')} G`;
                        else if (w >= 0.000001) weightLabel = `${(w * 1000000).toFixed(1).replace(/\.0$/, '')} MG`;
                        else if (w >= 0.000000001) weightLabel = `${(w * 1000000000).toFixed(1).replace(/\.0$/, '')} UG`;
                        else weightLabel = `${(w * 1000000000000).toFixed(1).replace(/\.0$/, '')} NG`;
                    }
                }

                let sizeLabel = 'Unknown';
                if (org.size) {
                    const s = org.size;
                    if (this.unitSystem === 'imperial') {
                        const totalInches = s * 39.3701;
                        const feet = Math.floor(totalInches / 12);
                        const inches = Math.round(totalInches % 12);
                        if (feet > 0) {
                            sizeLabel = inches === 0 ? `${feet} FT` : `${feet} FT ${inches} IN`;
                        } else {
                            sizeLabel = `${inches} IN`;
                        }
                    } else {
                        if (s >= 1000) sizeLabel = `${(s / 1000).toFixed(1).replace(/\.0$/, '')} KM`;
                        else if (s >= 1) sizeLabel = `${s} M`;
                        else if (s >= 0.01) sizeLabel = `${(s * 100).toFixed(1).replace(/\.0$/, '')} CM`;
                        else if (s >= 0.001) sizeLabel = `${(s * 1000).toFixed(1).replace(/\.0$/, '')} MM`;
                        else if (s >= 0.000001) sizeLabel = `${(s * 1000000).toFixed(1).replace(/\.0$/, '')} UM`;
                        else sizeLabel = `${(s * 1000000000).toFixed(1).replace(/\.0$/, '')} NM`;
                    }
                }

                const robustness = (parseFloat(org.weight) || 0) / (parseFloat(org.size) || 1);
                const robustnessLabel = robustness.toFixed(2);

                document.getElementById('modal-content').innerHTML = `
                <div class="detail-header" style="background-image: url('${this.rarityBackground(rarity)}'); background-size: cover; background-position: center;">
                    <div class="detail-header-overlay" style="background:linear-gradient(135deg, ${rarityColor}33 0%, var(--bg-root) 100%)"></div>
                    <div class="detail-sprite-wrap">
                        <img src="${spriteSrc}" alt="${org.name}"
                             onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
                        <div class="sprite-fallback" style="display:none;font-size:5rem">🦎</div>
                    </div>
                    <div class="detail-intro">
                        <div class="type-row">
                            ${types.map(t => { const tSlug = t.toLowerCase().replace(/ /g, '_'); return `<span class="type-badge type-${tSlug}" title="${t.toUpperCase()}"><img src="assets/icon/${tSlug}.png" class="type-icon" alt="${t}" onerror="this.style.display='none'"></span>` }).join('')}
                        </div>
                        <h2 class="detail-name">${org.name.toUpperCase()}</h2>
                        <div class="detail-sciname">${org.scientific_name || ''}</div>
                        <div class="classification-row">
                            <div class="class-badge">
                                <img src="assets/icon/${aClass.toLowerCase().replace(/ /g, '_')}.png" alt="${aClass}" onerror="this.src='assets/icon/unknown.png'">
                                <div class="badge-label">
                                    <span class="badge-type">Class</span>
                                    <span class="badge-value">${aClass.toUpperCase()}</span>
                                </div>
                            </div>
                            <div class="diet-badge">
                                <img src="assets/icon/${aDiet.toLowerCase().replace(/ /g, '_')}.png" alt="${aDiet}" onerror="this.src='assets/icon/unknown.png'">
                                <div class="badge-label">
                                    <span class="badge-type">Diet</span>
                                    <span class="badge-value">${aDiet.toUpperCase()}</span>
                                </div>
                            </div>
                            <div class="class-badge">
                                <div style="font-size:20px;line-height:22px;text-align:center;width:22px;">⚖️</div>
                                <div class="badge-label">
                                    <span class="badge-type">Weight</span>
                                    <span class="badge-value">${weightLabel.toUpperCase()}</span>
                                </div>
                            </div>
                            <div class="class-badge">
                                <div style="font-size:20px;line-height:22px;text-align:center;width:22px;">📏</div>
                                <div class="badge-label">
                                    <span class="badge-type">Size</span>
                                    <span class="badge-value">${sizeLabel.toUpperCase()}</span>
                                </div>
                            </div>
                            <div class="class-badge">
                                <div style="font-size:20px;line-height:22px;text-align:center;width:22px;">💪</div>
                                <div class="badge-label">
                                    <span class="badge-type">Robustness</span>
                                    <span class="badge-value">${robustnessLabel} λ</span>
                                </div>
                            </div>
                            <div class="class-badge">
                                <div style="font-size:20px;line-height:22px;text-align:center;width:22px;">🕒</div>
                                <div class="badge-label">
                                    <span class="badge-type">Activity</span>
                                    <span class="badge-value">${aActivity.toUpperCase()}</span>
                                </div>
                            </div>
                        </div>
                        <span class="rarity-pill" style="background:${rarityColor}22;color:${rarityColor};border-color:${rarityColor}55;margin-top:10px;">${rarity.toUpperCase()}</span>
                    </div>
                </div>

                <div class="detail-body">
                    <div class="detail-section">
                        <div class="detail-section-title">📋 MISSION BRIEF</div>
                        <p class="detail-desc">${org.description || 'No field data available.'}</p>
                    </div>

                    <div class="detail-section">
                        <div class="detail-section-title">📊 BASE STATS</div>
                        ${statsHTML}
                        <div class="total-stat">BST: ${(org.health || 0) + (org.attack || 0) + (org.defense || 0) + (org.power || 0) + (org.resistance || 0) + (org.speed || 0)}</div>
                    </div>

                    <div class="detail-section">
                        <div class="detail-section-title">🗺 HABITAT SIGNATURES</div>
                        <div class="biome-row">${biomesHTML}</div>
                    </div>

                    <div class="detail-section">
                        <div class="detail-section-title">⚡ SYSTEM CAPABILITIES</div>
                        ${abilitiesHTML}
                    </div>

                    <div class="detail-section">
                        <div class="detail-section-title">⚔ COMBAT ARCHIVE</div>
                        ${movesHTML}
                    </div>

                    <div class="detail-section">
                        <div class="detail-section-title">🎁 LOOT DROPS</div>
                        <div class="drops-row">${dropsHTML}</div>
                    </div>
                </div>`;

                document.getElementById('modal').classList.add('open');
                document.body.style.overflow = 'hidden';
            },

            showMoveDetail(mName) {
                const md = this.db.moves[mName.toLowerCase()];
                if (!md) return;
                const tc = this.typeColor(md.type || 'basic');
                const content = document.getElementById('modal-content');
                const existing = content.innerHTML;

                const overlay = document.createElement('div');
                overlay.className = 'move-overlay';
                overlay.innerHTML = `
                <div class="move-detail-card">
                    <button class="close-move-overlay" onclick="this.parentElement.parentElement.remove()">✕</button>
                    <div class="move-detail-name">${mName.toUpperCase()}</div>
                    <span class="type-badge type-${(md.type || 'basic').toLowerCase()}" title="${(md.type || 'basic').toUpperCase()}"><img src="assets/icon/${(md.type || 'basic').toLowerCase()}.png" class="type-icon" alt="${md.type || 'basic'}" onerror="this.style.display='none'"></span>
                    <div class="move-detail-stats">
                        <div class="mds-row"><span>POWER</span><b>${md.baseDamage || '—'}</b></div>
                        <div class="mds-row"><span>ACCURACY</span><b>${md.accuracy || '100'}%</b></div>
                        <div class="mds-row"><span>PP (STAMINA)</span><b>${md.stamina || '—'}</b></div>
                        <div class="mds-row"><span>CATEGORY</span><b>${md.category || '—'}</b></div>
                    </div>
                    <p class="move-detail-desc">${md.description || 'No description.'}</p>
                </div>`;
                overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };
                document.getElementById('modal-content').appendChild(overlay);
            },

            showItemDetail(item) {
                const imgSrc = `assets/items/${(item.name || '').toLowerCase().replace(/\s+/g, '-').replace(/[^a-z0-9-]/g, '')}.png`;
                const effectsHTML = (item.effects || []).map(e =>
                    `<div class="detail-ability-card">
                    <div class="ability-name">${e.type?.toUpperCase() || 'EFFECT'}</div>
                    <div class="ability-desc">Stat: <b>${e.stat || '—'}</b> | Magnitude: <b>${e.magnitude || '—'}x</b></div>
                </div>`).join('') || '<p class="dim">No effects listed.</p>';

                document.getElementById('modal-content').innerHTML = `
                <div class="detail-header">
                    <div class="detail-sprite-wrap">
                        <img src="${imgSrc}" alt="${item.name}" onerror="this.style.display='none'">
                    </div>
                    <div class="detail-intro">
                        <span class="type-badge" style="background:var(--accent-dim);color:var(--accent)">${(item.category || 'item').toUpperCase()}</span>
                        <h2 class="detail-name">${(item.name || '').replace(/_/g, ' ').toUpperCase()}</h2>
                        <div class="detail-sciname">${item.price ? '💰 ' + item.price + 'G' : ''}</div>
                    </div>
                </div>
                <div class="detail-body">
                    <div class="detail-section">
                        <div class="detail-section-title">📋 DESCRIPTION</div>
                        <p class="detail-desc">${item.description || 'No description.'}</p>
                    </div>
                    <div class="detail-section">
                        <div class="detail-section-title">⚡ MODIFIERS</div>
                        ${effectsHTML}
                    </div>
                </div>`;

                document.getElementById('modal').classList.add('open');
                document.body.style.overflow = 'hidden';
            },

            setMode(m) {
                this.mode = m;
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.getElementById(m === 'animals' ? 'btn-animals' : 'btn-items').classList.add('active');
                document.getElementById('animal-filters').style.display = m === 'animals' ? '' : 'none';
                document.getElementById('item-filters').style.display = m === 'items' ? '' : 'none';
                this.filter();
            },

            setSort(s) {
                this.sortBy = s;
                document.querySelectorAll('.sort-chip').forEach(c => {
                    c.classList.toggle('active', c.dataset.sort === s);
                });
                this.filter();
            },

            setUnitSystem(val) {
                this.unitSystem = val;
                this.filter();
            },

            toggleOrder() {
                this.ascending = !this.ascending;
                document.getElementById('order-label').textContent = this.ascending ? 'ASCENDING' : 'DESCENDING';
                document.getElementById('order-icon').textContent = this.ascending ? '↑' : '↓';
                this.filter();
            },

            reset() {
                document.getElementById('q').value = '';
                ['flt-biome', 'flt-cat1', 'flt-cat2', 'flt-rarity', 'flt-ability', 'flt-move', 'flt-drop', 'flt-class', 'flt-diet', 'flt-weight', 'flt-size', 'flt-robustness', 'flt-bst', 'flt-item-cat'].forEach(id => {
                    const el = document.getElementById(id);
                    if (el) el.selectedIndex = 0;
                });
                document.getElementById('chk-exclude-mythical').checked = false;
                this.sortBy = 'name';
                this.ascending = true;
                this.unitSystem = 'metric';
                document.getElementById('flt-units').value = 'metric';
                document.querySelectorAll('.sort-chip').forEach(c => c.classList.toggle('active', c.dataset.sort === 'name'));
                document.getElementById('order-label').textContent = 'ASCENDING';
                document.getElementById('order-icon').textContent = '↑';
                this.filter();
            },

            closeModal() {
                document.getElementById('modal').classList.remove('open');
                document.body.style.overflow = '';
            },

            toggleFilter() {
                document.getElementById('sidebar').classList.toggle('open');
                document.getElementById('sidebar-overlay').classList.toggle('active');
            },

            rarityBackground(rarity) {
                const r = rarity.toLowerCase();
                if (r.includes('common')) return 'assets/icon/common.png';
                if (r.includes('uncommon')) return 'assets/icon/uncommon.png';
                if (r.includes('rare')) return 'assets/icon/rare.png';
                if (r.includes('epic')) return 'assets/icon/epic.png';
                if (r.includes('legendary')) return 'assets/icon/legendary.png';
                if (r.includes('mythical')) return 'assets/icon/mythical.png';
                return 'assets/icon/common.png';
            }
        };

        App.start();
    </script>
</body>

</html>
