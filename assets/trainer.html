<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Model Trainer</title>
    <style>
        body {
            background-color: #0D1117;
            color: #FFFFFF;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #FFB300;
            margin-bottom: 5px;
        }
        p.subtitle {
            color: #B0BEC5;
            margin-bottom: 30px;
            text-align: center;
        }
        .container {
            width: 100%;
            max-width: 700px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .input-row {
            display: flex;
            gap: 12px;
        }
        .input-row .input-group {
            flex: 1;
        }
        label {
            color: #546E7A;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        input[type="text"], input[type="number"], select {
            background-color: #161B22;
            border: 1px solid #30363D;
            color: white;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
            width: 100%;
            box-sizing: border-box;
        }
        input[type="text"]:focus, input[type="number"]:focus, select:focus {
            border-color: #00BFA5;
        }
        select option {
            background-color: #161B22;
            color: white;
        }
        #drop-zone {
            background-color: #161B22;
            border: 2px dashed #30363D;
            border-radius: 12px;
            padding: 60px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }
        #drop-zone.dragover {
            background-color: rgba(0, 191, 165, 0.1);
            border-color: #00BFA5;
        }
        #drop-zone p {
            margin: 0;
            color: #B0BEC5;
            font-size: 16px;
        }
        .log-container {
            background-color: #000000;
            border: 1px solid #30363D;
            border-radius: 8px;
            padding: 16px;
            height: 200px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 13px;
        }
        .log-success { color: #69F0AE; }
        .log-error { color: #FF5252; }
        .log-info { color: #B0BEC5; }
        .log-header { color: #00BFA5; font-weight: bold; }
        .log-meta { color: #FFB300; }
        
        .loader {
            border: 3px solid rgba(255,255,255,0.1);
            border-radius: 50%;
            border-top: 3px solid #00BFA5;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            display: none;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .matched-badge {
            display: inline-block;
            background: rgba(105, 240, 174, 0.15);
            color: #69F0AE;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
            margin-top: 4px;
        }
    </style>
</head>
<body>

    <h1>Model Trainer</h1>
    <p class="subtitle">Enter the species scientific name, configure biological metadata, and drop images to train.</p>

    <div class="container">
        <div class="input-group">
            <label for="scientificName">Scientific Name</label>
            <input type="text" id="scientificName" placeholder="e.g. Panthera tigris" />
            <div id="match-badge" style="display:none" class="matched-badge"></div>
        </div>

        <div class="input-row">
            <div class="input-group">
                <label for="animalClass">Class</label>
                <select id="animalClass">
                    <option value="unknown">Unknown</option>
                    <option value="mammal">Mammal</option>
                    <option value="bird">Bird</option>
                    <option value="fish">Fish</option>
                    <option value="amphibian">Amphibian</option>
                    <option value="reptile">Reptile</option>
                    <option value="insect">Insect</option>
                    <option value="invertebrate">Invertebrate</option>
                </select>
            </div>
            <div class="input-group">
                <label for="animalDiet">Diet</label>
                <select id="animalDiet">
                    <option value="unknown">Unknown</option>
                    <option value="carnivore">Carnivore</option>
                    <option value="herbivore">Herbivore</option>
                    <option value="omnivore">Omnivore</option>
                    <option value="insectivore">Insectivore</option>
                    <option value="piscivore">Piscivore</option>
                    <option value="scavenger">Scavenger</option>
                    <option value="detritivore">Detritivore</option>
                    <option value="filter feeder">Filter Feeder</option>
                    <option value="nectarivore">Nectarivore</option>
                    <option value="granivore">Granivore</option>
                </select>
            </div>
            <div class="input-group">
                <label for="animalWeight">Weight (kg)</label>
                <input type="number" id="animalWeight" placeholder="0.0" step="0.001" min="0" />
            </div>
        </div>

        <div id="drop-zone">
            <div class="loader" id="loader"></div>
            <p id="drop-text">Drag & Drop Images Here<br><br><span style="font-size:14px;color:#546E7A;">(Or click to browse)</span></p>
            <input type="file" id="file-input" multiple accept="image/png, image/jpeg" style="display: none;" />
        </div>

        <div class="log-container" id="log-output">
            <div class="log-info">Ready for training. Database modifications will apply directly to sprite_features.db</div>
        </div>
    </div>

    <script>
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const scientificNameInput = document.getElementById('scientificName');
        const animalClassSelect = document.getElementById('animalClass');
        const animalDietSelect = document.getElementById('animalDiet');
        const animalWeightInput = document.getElementById('animalWeight');
        const logOutput = document.getElementById('log-output');
        const loader = document.getElementById('loader');
        const dropText = document.getElementById('drop-text');
        const matchBadge = document.getElementById('match-badge');

        // Auto-lookup from Organisms.json
        let organisms = [];
        fetch('Organisms.json')
            .then(r => r.json())
            .then(data => {
                organisms = data;
                appendLog(`Loaded ${data.length} organisms for auto-lookup.`, 'info');
            })
            .catch(() => appendLog('Organisms.json not found for auto-lookup.', 'info'));

        scientificNameInput.addEventListener('input', () => {
            const val = scientificNameInput.value.trim().toLowerCase();
            if (!val || organisms.length === 0) {
                matchBadge.style.display = 'none';
                return;
            }
            const match = organisms.find(o =>
                (o.scientific_name || '').toLowerCase() === val ||
                (o.name || '').toLowerCase() === val
            );
            if (match) {
                matchBadge.style.display = 'inline-block';
                matchBadge.textContent = `✓ Matched: ${match.name}`;
                // Auto-populate fields
                const cls = (match.class || match.animal_class || 'unknown').toLowerCase();
                const diet = (match.diet || 'unknown').toLowerCase();
                const weight = match.weight || '';
                if ([...animalClassSelect.options].some(o => o.value === cls)) animalClassSelect.value = cls;
                if ([...animalDietSelect.options].some(o => o.value === diet)) animalDietSelect.value = diet;
                if (weight) animalWeightInput.value = weight;
            } else {
                matchBadge.style.display = 'none';
            }
        });

        function appendLog(message, type = 'info') {
            const div = document.createElement('div');
            div.className = `log-${type}`;
            div.innerText = message;
            logOutput.appendChild(div);
            logOutput.scrollTop = logOutput.scrollHeight;
        }

        dropZone.addEventListener('click', () => fileInput.click());
        
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            if (e.dataTransfer.files.length > 0) {
                processFiles(e.dataTransfer.files);
            }
        });

        fileInput.addEventListener('change', () => {
            if (fileInput.files.length > 0) {
                processFiles(fileInput.files);
            }
            fileInput.value = '';
        });

        async function processFiles(files) {
            const sciName = scientificNameInput.value.trim();
            if (!sciName) {
                appendLog('ERROR: Please enter a scientific name first.', 'error');
                return;
            }

            const animalClass = animalClassSelect.value;
            const diet = animalDietSelect.value;
            const weight = animalWeightInput.value ? parseFloat(animalWeightInput.value) : null;

            appendLog(`--- Starting batch for ${sciName} (${files.length} files) ---`, 'header');
            appendLog(`Metadata: class=${animalClass}, diet=${diet}, weight=${weight || 'N/A'}kg`, 'meta');
            
            loader.style.display = 'block';
            dropText.style.display = 'none';

            const imagesBase64 = [];
            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                try {
                    const base64 = await toBase64(file);
                    const b64Data = base64.split(',')[1];
                    imagesBase64.push({
                        name: file.name,
                        data: b64Data
                    });
                } catch (e) {
                    appendLog(`Failed to read file ${file.name}`, 'error');
                }
            }

            try {
                const response = await fetch('/train', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        scientificName: sciName,
                        animalClass: animalClass !== 'unknown' ? animalClass : null,
                        diet: diet !== 'unknown' ? diet : null,
                        weight: weight,
                        images: imagesBase64
                    })
                });

                const result = await response.json();
                
                if (response.ok) {
                    result.logs.forEach(log => appendLog(log.msg, log.type));
                    appendLog(`--- Batch Complete (${result.successCount} succeeded, ${result.failCount} failed) ---`, 'header');
                } else {
                    appendLog(`Server Error: ${result.error}`, 'error');
                }
            } catch (e) {
                appendLog(`Connection failed. Is the Dart server running? ${e.message}`, 'error');
            } finally {
                loader.style.display = 'none';
                dropText.style.display = 'block';
            }
        }

        function toBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }
    </script>
</body>
</html>
