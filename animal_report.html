<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Animal Warfare Rankings | Anidex</title>
    <meta name="description" content="Dynamic rankings for Animal Warfare.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=Press+Start+2P&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-root: #080c10;
            --bg-card: #0f1923;
            --bg-sidebar: #0a0f14;
            --accent: #4cffb3;
            --accent2: #f97316;
            --text-primary: #e2e8f0;
            --text-muted: #6b7280;
            --text-dim: #374151;
            --border: #1a2535;
            --font-pixel: 'Press Start 2P', monospace;
            --font-body: 'Inter', system-ui, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--bg-root);
            color: var(--text-primary);
            font-family: var(--font-body);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Nav */
        .nav-bar {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 14px 24px;
            background: rgba(10, 15, 20, 0.97);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-logo {
            font-family: var(--font-pixel);
            font-size: 11px;
            color: var(--accent);
            text-decoration: none;
        }

        .nav-title {
            font-family: var(--font-pixel);
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #fff;
        }

        .container {
            flex: 1;
            padding: 24px;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        /* Stats & Controls */
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 24px;
            background: var(--bg-card);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        input,
        select {
            background: var(--bg-root);
            border: 1px solid var(--border);
            color: #fff;
            padding: 10px 14px;
            border-radius: 6px;
            outline: none;
            font-family: inherit;
        }

        input:focus {
            border-color: var(--accent);
        }

        /* Table */
        .table-wrap {
            background: var(--bg-card);
            border-radius: 12px;
            border: 1px solid var(--border);
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background: rgba(255, 255, 255, 0.02);
            padding: 16px;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border);
        }

        td {
            padding: 16px;
            border-bottom: 1px solid var(--border);
            vertical-align: middle;
        }

        tr:hover {
            background: rgba(255, 255, 255, 0.01);
        }

        /* Rankings UI */
        .rank-badge {
            font-family: var(--font-pixel);
            font-size: 10px;
            color: var(--accent2);
            opacity: 0.8;
        }

        .anim-row {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .anim-sprite {
            width: 56px;
            height: 56px;
            object-fit: contain;
            image-rendering: pixelated;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            padding: 4px;
            border: 1px solid var(--border);
        }

        .anim-name {
            font-weight: 700;
            font-size: 16px;
            display: block;
            margin-bottom: 4px;
        }

        .type-tags {
            display: flex;
            gap: 6px;
        }

        .type-tag {
            font-size: 10px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 4px;
            text-transform: uppercase;
            background: var(--text-dim);
        }

        .stat-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            font-size: 11px;
            min-width: 200px;
        }

        .stat-item {
            background: rgba(0, 0, 0, 0.2);
            padding: 4px 8px;
            border-radius: 4px;
            border-left: 2px solid var(--accent);
        }

        .stat-val {
            font-weight: 700;
            color: #fff;
        }

        .score-pill {
            background: linear-gradient(135deg, var(--accent), #00d4ff);
            color: #000;
            font-weight: 900;
            padding: 6px 12px;
            border-radius: 20px;
            text-align: center;
            font-family: var(--font-pixel);
            font-size: 10px;
            box-shadow: 0 0 15px rgba(76, 255, 179, 0.3);
        }

        /* Type Colors */
        .type-basic {
            background: #9199a1;
        }

        .type-blaze {
            background: #ff4a4a;
        }

        .type-aquatic {
            background: #3c92ff;
        }

        .type-grass {
            background: #4caf50;
        }

        .type-electric {
            background: #ffeb3b;
            color: #000;
        }

        .type-cryo {
            background: #00bcd4;
        }

        .type-martial {
            background: #e91e63;
        }

        .type-toxic {
            background: #9c27b0;
        }

        .type-earth {
            background: #795548;
        }

        .type-flying {
            background: #2196f3;
        }

        .type-mystic {
            background: #673ab7;
        }

        .type-arthropod {
            background: #8bc34a;
        }

        .type-rock {
            background: #607d8b;
        }

        .type-spectral {
            background: #3f51b5;
        }

        .type-darkness {
            background: #212121;
        }

        .type-holy {
            background: #ffc107;
            color: #000;
        }

        .type-aura {
            background: #009688;
        }

        .type-drake {
            background: #ff5722;
        }

        .pager {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 32px;
            padding-bottom: 40px;
        }

        .page-btn {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: #fff;
            padding: 8px 16px;
            cursor: pointer;
            border-radius: 6px;
            font-family: var(--font-pixel);
            font-size: 10px;
        }

        .page-btn.active {
            border-color: var(--accent);
            color: var(--accent);
        }
    </style>
</head>

<body>
    <nav class="nav-bar">
        <a href="index.html" class="nav-logo">ANIDEX</a>
        <div style="color:var(--border); font-size: 20px;">/</div>
        <div class="nav-title">Global Rankings</div>
    </nav>

    <div class="container">
        <div class="controls">
            <input type="text" id="searchTerm" placeholder="Search by name, type, or ability..."
                style="flex: 1; min-width: 250px;">
            <select id="rarityFilter">
                <option value="">All Rarities</option>
                <option value="common">Common</option>
                <option value="uncommon">Uncommon</option>
                <option value="rare">Rare</option>
                <option value="epic">Epic</option>
                <option value="legendary">Legendary</option>
                <option value="mythical">Mythical</option>
            </select>
            <select id="roleFilter">
                <option value="">All Roles</option>
            </select>
        </div>

        <div class="table-wrap">
            <table id="rankingsTable">
                <thead>
                    <tr>
                        <th style="width: 50px;">Rank</th>
                        <th>Animal</th>
                        <th>Stats</th>
                        <th>Role / Defense</th>
                        <th style="text-align: center;">Score</th>
                    </tr>
                </thead>
                <tbody id="rankingBody">
                    <tr>
                        <td colspan="5"
                            style="text-align:center; padding: 100px; color: var(--text-muted); font-family:var(--font-pixel); font-size:10px;">
                            LOADING ANIDEX DATA...</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="pager" id="pagination"></div>
    </div>

    <script>
        const TYPE_CHART = {
            electric: { flying: 2, aquatic: 2, electric: 0.5, sound: 2, grass: 0.5, drake: 0.5, earth: 0 },
            sound: { flying: 2, aquatic: 2, aura: 2, metal: 0.5, rock: 0.5, electric: 0.5, spectral: 0 },
            arthropod: { grass: 2, darkness: 2, aura: 2, flying: 0.5, martial: 0.5, rock: 0.5, blaze: 0.5, toxic: 0.5, metal: 0.5, spectral: 0.5, mystic: 0.5 },
            blaze: { arthropod: 2, metal: 2, grass: 2, cryo: 2, blaze: 0.5, rock: 0.5, aquatic: 0.5, drake: 0.5 },
            rock: { flying: 2, blaze: 2, arthropod: 2, cryo: 2, earth: 0.5, martial: 0.5, metal: 0.5 },
            holy: { spectral: 2, darkness: 2, drake: 2, metal: 0.5, blaze: 0.5, mystic: 0.5 },
            flying: { arthropod: 2, grass: 2, martial: 2, rock: 0.5, sound: 0.5, electric: 0.5, cryo: 0.5, metal: 0.5 },
            aquatic: { earth: 2, rock: 2, blaze: 2, aquatic: 0.5, grass: 0.5, sound: 0.5, drake: 0.5, cryo: 0.5 },
            metal: { cryo: 2, rock: 2, mystic: 2, holy: 2, aquatic: 0.5, blaze: 0.5, metal: 0.5, electric: 0.5 },
            martial: { cryo: 2, rock: 2, basic: 2, darkness: 2, arthropod: 0.5, metal: 2, flying: 0.5, toxic: 0.5, spectral: 0, aura: 0.5, mystic: 0.5 },
            basic: { rock: 0.5, metal: 0.5, spectral: 0 },
            earth: { cryo: 2, electric: 2, sound: 2, rock: 2, toxic: 2, blaze: 2, flying: 0, grass: 0.5, arthropod: 0.5 },
            cryo: { flying: 2, grass: 2, drake: 2, earth: 2, sound: 2, blaze: 0.5, aquatic: 0.5, cryo: 0.5, metal: 0.5 },
            darkness: { aura: 2, holy: 2, spectral: 2, darkness: 0.5, martial: 0.5, mystic: 0.5 },
            drake: { drake: 2, mystic: 0, metal: 0.5, holy: 0.5 },
            aura: { martial: 2, toxic: 2, metal: 0.5, aura: 0.5, darkness: 0 },
            mystic: { drake: 2, toxic: 0.5, martial: 2, metal: 0.5, blaze: 0.5, darkness: 2, sound: 0.5 },
            toxic: { grass: 2, holy: 2, toxic: 0.5, mystic: 2, metal: 0, earth: 0.5, rock: 0.5, spectral: 0.5 },
            grass: { aquatic: 2, earth: 2, rock: 2, blaze: 0.5, grass: 0.5, toxic: 0.5, flying: 0.5, arthropod: 0.5, metal: 0.5, drake: 0.5 },
            spectral: { spectral: 2, aura: 2, basic: 0, darkness: 0.5, holy: 0 }
        };

        const TYPE_LIST = Object.keys(TYPE_CHART);

        let organisms = [];
        let filtered = [];
        let curPage = 1;
        const perPage = 25;

        function getDefenseData(types) {
            const results = {};
            TYPE_LIST.forEach(atk => {
                let multi = 1.0;
                types.forEach(def => {
                    const row = TYPE_CHART[atk.toLowerCase()];
                    if (row && row[def.toLowerCase()] !== undefined) {
                        multi *= row[def.toLowerCase()];
                    }
                });
                if (multi !== 1.0) results[atk] = multi;
            });

            const weaks = [], resists = [], immunes = [];
            let weightedSum = 0;
            TYPE_LIST.forEach(type => {
                const m = results[type] === undefined ? 1.0 : results[type];
                weightedSum += m;
                if (m >= 2) weaks.push(`${type}(${m}x)`);
                else if (m === 0) immunes.push(type);
                else if (m < 1) resists.push(`${type}(${m}x)`);
            });

            // Normalized defense score
            const defNorm = Math.max(0, 100 - (weightedSum - 18) * 4);
            return { weaks, resists, immunes, defNorm };
        }

        async function init() {
            try {
                const res = await fetch('assets/Organisms.json');
                const data = await res.json();

                organisms = data.filter(o => {
                    return !(o.health >= 999 || o.attack >= 999 || o.defense >= 999 || o.power >= 999 || o.resistance >= 999 || o.speed >= 999);
                }).map(o => {
                    const hp = o.health || 0, atk = o.attack || 0, def = o.defense || 0, pwr = o.power || 0, res = o.resistance || 0, spd = o.speed || 0;
                    const bst = hp + atk + def + pwr + res + spd;
                    const cats = (o.category || '').split(',').map(s => s.trim().toLowerCase()).filter(s => s);

                    const { weaks, resists, immunes, defNorm } = getDefenseData(cats);

                    let role = '⚖️ Balanced';
                    if (bst >= 550 && (atk >= 130 || pwr >= 130)) role = '👑 Apex Predator';
                    else if (hp >= 130 && (def + res >= 180)) role = '🏛️ Titan';
                    else if ((atk >= 120 || pwr >= 120) && (hp + def + res <= 180)) role = '💥 Glass Cannon';
                    else if (spd >= 115) role = '⚡ Speedster';
                    else if ((atk >= 110 || pwr >= 110) && spd >= 90) role = '⚔️ Sweeper';
                    else if (def + res >= 220) role = '🛡️ Wall';
                    else if (hp >= 100 && (def + res >= 160)) role = '🛡️ Tank';
                    else if ((atk >= 100 || pwr >= 100) && spd <= 75) role = '🐂 Bruiser';

                    const mvs = (o.moves || '').split(',').map(s => s.trim()).filter(s => s);
                    const apps = (o.abilities || '').split(',').map(s => s.trim()).filter(s => s);

                    const statScore = (bst / 700) * 75;
                    const defScore = defNorm * 0.15;
                    const moveScore = Math.min(10, mvs.length);
                    const score = statScore + defScore + moveScore;

                    return { ...o, bst, role, score, weaks, resists, immunes, defNorm, mvs, abs: apps };
                });

                // Sort and assign global rank
                organisms.sort((a, b) => b.score - a.score);
                organisms.forEach((o, i) => o.globalRank = i + 1);

                const rf = document.getElementById('roleFilter');
                ['👑 Apex Predator', '🏛️ Titan', '💥 Glass Cannon', '⚡ Speedster', '⚔️ Sweeper', '🛡️ Wall', '🛡️ Tank', '🐂 Bruiser', '⚖️ Balanced'].forEach(r => {
                    const opt = document.createElement('option'); opt.value = r; opt.innerText = r; rf.appendChild(opt);
                });

                updateFiltered();
            } catch (err) {
                console.error(err);
                document.getElementById('rankingBody').innerHTML = `<tr><td colspan="5" style="text-align:center; color: red;">Error parsing data.</td></tr>`;
            }
        }

        function updateFiltered() {
            const q = document.getElementById('searchTerm').value.toLowerCase();
            const rar = document.getElementById('rarityFilter').value.toLowerCase();
            const rol = document.getElementById('roleFilter').value;

            filtered = organisms.filter(o => {
                if (rar && (o.rarity || '').toLowerCase() !== rar) return false;
                if (rol && o.role !== rol) return false;
                if (q) {
                    const hay = [o.name, o.category || '', o.role, ...(o.abs || []), ...(o.mvs || [])].join(' ').toLowerCase();
                    if (!hay.includes(q)) return false;
                }
                return true;
            });

            // Maintain global rank order
            filtered.sort((a, b) => a.globalRank - b.globalRank);
            render();
        }

        function render() {
            const body = document.getElementById('rankingBody');
            const pag = document.getElementById('pagination');
            body.innerHTML = '';

            const start = (curPage - 1) * perPage;
            const pageData = filtered.slice(start, start + perPage);

            pageData.forEach((o, i) => {
                const tr = document.createElement('tr');
                const cleanName = o.name.toLowerCase().replace(/ /g, '_');
                const types = (o.category || '').split(',').map(t => t.trim()).filter(t => t);

                tr.innerHTML = `
                    <td><div class="rank-badge">#${o.globalRank}</div></td>
                    <td>
                        <div class="anim-row">
                            <img class="anim-sprite" src="assets/sprites/${cleanName}.png" onerror="this.src='assets/sprites/default.png'">
                            <div>
                                <span class="anim-name" style="color:#fff;">${o.name}</span>
                                <div class="type-tags">
                                    ${types.map(t => `<span class="type-tag type-${t.toLowerCase()}">${t}</span>`).join('')}
                                </div>
                                <div style="font-size:10px; color:var(--text-muted); margin-top:10px; line-height:1.5;">
                                    <span style="color:var(--accent2); font-weight:700;">ABILITIES:</span> ${o.abs.slice(0, 2).join(', ')}${o.abs.length > 2 ? '...' : ''}<br>
                                    <span style="color:var(--accent); font-weight:700;">MOVES:</span> ${o.mvs.slice(0, 4).join(', ')}${o.mvs.length > 4 ? '...' : ''}
                                </div>
                            </div>
                        </div>
                    </td>
                    <td>
                        <div class="stat-grid">
                            <div class="stat-item">HP<br><span class="stat-val">${o.health}</span></div>
                            <div class="stat-item">ATK<br><span class="stat-val">${o.attack}</span></div>
                            <div class="stat-item">DEF<br><span class="stat-val">${o.defense}</span></div>
                            <div class="stat-item">PWR<br><span class="stat-val">${o.power}</span></div>
                            <div class="stat-item">RES<br><span class="stat-val">${o.resistance}</span></div>
                            <div class="stat-item">SPD<br><span class="stat-val">${o.speed}</span></div>
                        </div>
                    </td>
                    <td>
                        <div style="font-size:12px; font-weight:800; color:var(--accent); margin-bottom:8px;">${o.role}</div>
                        <div style="font-size:10px; color:var(--text-muted); line-height:1.6;">
                            ${o.weaks.length > 0 ? `<div><span style="color:#ff4a4a; font-weight:700;">WEAK:</span> <span style="color:#e2e8f0">${o.weaks.join(', ')}</span></div>` : ''}
                            ${o.immunes.length > 0 ? `<div><span style="color:var(--accent); font-weight:700;">IMMUNE:</span> <span style="color:#e2e8f0">${o.immunes.join(', ')}</span></div>` : ''}
                            ${o.resists.length > 0 ? `<div><span style="color:#4caf50; font-weight:700;">RESIST:</span> <span style="color:#e2e8f0">${o.resists.slice(0, 3).join(', ')}${o.resists.length > 3 ? '...' : ''}</span></div>` : ''}
                        </div>
                    </td>
                    <td style="text-align:center;">
                        <div class="score-pill">${o.score.toFixed(1)}</div>
                        <div style="font-size:9px; color:var(--text-dim); margin-top:8px; font-family:var(--font-pixel);">BST: ${o.bst}</div>
                    </td>
                `;
                body.appendChild(tr);
            });

            pag.innerHTML = '';
            const totalPages = Math.ceil(filtered.length / perPage);
            const displayPages = Math.min(totalPages, 12);
            for (let p = 1; p <= displayPages; p++) {
                const btn = document.createElement('button');
                btn.className = `page-btn ${p === curPage ? 'active' : ''}`;
                btn.innerText = p;
                btn.onclick = () => { curPage = p; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); };
                pag.appendChild(btn);
            }
        }

        document.getElementById('searchTerm').addEventListener('input', () => { curPage = 1; updateFiltered(); });
        document.getElementById('rarityFilter').addEventListener('change', () => { curPage = 1; updateFiltered(); });
        document.getElementById('roleFilter').addEventListener('change', () => { curPage = 1; updateFiltered(); });

        init();
    </script>
</body>

</html>
